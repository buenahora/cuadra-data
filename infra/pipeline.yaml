AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Pipeline de datos de la plataforma de alquileres. Buckets del data lake, Lambdas de
  scraping, Glue Python shell, catálogo, Athena, Step Functions, Scheduler semanal y
  alertas. Lo despliega el CI del repo del pipeline.

Parameters:
  # En cuentas con plan FREE el límite total de concurrencia de Lambda es 10, y
  # AWS exige dejar 10 sin reservar: reservar aunque sea 1 falla con
  # "decreases account's UnreservedConcurrentExecution below its minimum value
  # of [10]". Poner 0 saca la reserva. No cambia el ritmo de scraping: la
  # serialización real la hace MaxConcurrency 1 en el Map de la state machine.
  LambdaReservedConcurrency:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Concurrencia reservada del Lambda del scraper. 0 = sin reserva (obligatorio con plan FREE)
  Project:
    Type: String
    Default: alquileres
  Environment:
    Type: String
    Default: prd
    AllowedValues: [dev, prd]
  CodeVersion:
    Type: String
    Description: Prefijo de la versión en el bucket de artefactos (por ejemplo el SHA del commit)
  ScheduleExpression:
    Type: String
    Default: cron(0 6 ? * MON *)
    Description: Cuándo corre el pipeline, en hora de Montevideo
  PaginasPorTanda:
    Type: Number
    Default: 150
    MinValue: 1
    Description: >
      Páginas que baja cada invocación de la Lambda de scraping. A 1,2 s por
      request, 150 páginas son ~5 min: holgado contra el timeout de 15 min de
      Lambda. Bajarlo si el sitio responde más lento.

Conditions:
  ReservarConcurrencia: !Not [!Equals [!Ref LambdaReservedConcurrency, 0]]

Resources:
  # ---------------------------------------------------------------- Data lake
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-raw-${AWS::AccountId}'
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: tiering-raw
            Status: Enabled
            Transitions:
              - {StorageClass: STANDARD_IA, TransitionInDays: 30}
              - {StorageClass: GLACIER, TransitionInDays: 90}
            ExpirationInDays: 365
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}

  CuratedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-curated-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: multipart
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-athena-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: expirar, Status: Enabled, ExpirationInDays: 7}

  GlueTempBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-${Environment}-glue-temp-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: expirar, Status: Enabled, ExpirationInDays: 7}

  # ---------------------------------------------------------------- Lambdas de scraping
  ScraperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: escribir-raw
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${RawBucket.Arn}/*'

  # Una sola función para los dos modos del extractor (planificar las tandas
  # y correr una tanda) -- ver lambdas/scraper/app.py. Sumar una fuente nueva
  # es agregar otra función igual a esta, con su FUENTE, y otra rama en el
  # Parallel de la state machine (ver infra/README.md).
  InfoCasasFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Project}-${Environment}-scraper-infocasas'
      Runtime: python3.12
      Handler: app.handler
      Role: !GetAtt ScraperRole.Arn
      MemorySize: 512
      # 15 min, el máximo de Lambda. Cada tanda está dimensionada para tardar
      # ~5 (PaginasPorTanda), así que el timeout es red de contención, no el
      # tiempo esperado.
      Timeout: 900
      # Las tandas corren en serie (MaxConcurrency 1 en el Map): el ritmo de
      # requests al sitio queda igual que corriendo el extractor a mano.
      ReservedConcurrentExecutions: !If [ReservarConcurrencia, !Ref LambdaReservedConcurrency, !Ref 'AWS::NoValue']
      Code:
        S3Bucket:
          Fn::ImportValue: !Sub '${Project}-${Environment}-ArtifactsBucket'
        S3Key: !Sub 'pipeline/${CodeVersion}/scraper-infocasas.zip'
      Environment:
        Variables:
          RAW_BUCKET: !Ref RawBucket
          FUENTE: infocasas
          # !Sub y no !Ref: las env vars de Lambda son strings.
          PAGINAS_POR_TANDA: !Sub '${PaginasPorTanda}'

  InfoCasasLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${InfoCasasFunction}'
      RetentionInDays: 30

  # ---------------------------------------------------------------- Glue
  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: glue.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: datos-del-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt RawBucket.Arn, !Sub '${RawBucket.Arn}/*']
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !GetAtt CuratedBucket.Arn
                  - !Sub '${CuratedBucket.Arn}/*'
                  - !GetAtt GlueTempBucket.Arn
                  - !Sub '${GlueTempBucket.Arn}/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - 'arn:aws:s3:::${Bucket}/pipeline/*'
                  - Bucket:
                      Fn::ImportValue: !Sub '${Project}-${Environment}-ArtifactsBucket'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue: !Sub '${Project}-${Environment}-AppDbSecretArn'

  # Una connection por AZ, para que la carga a RDS no dependa de una sola zona
  GlueConnectionA:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Ref AWS::AccountId
      ConnectionInput:
        Name: !Sub '${Project}-${Environment}-vpc-a'
        ConnectionType: NETWORK
        PhysicalConnectionRequirements:
          SubnetId:
            Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetA'
          AvailabilityZone:
            Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetAAz'
          SecurityGroupIdList:
            - Fn::ImportValue: !Sub '${Project}-${Environment}-GlueSG'
  GlueConnectionB:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Ref AWS::AccountId
      ConnectionInput:
        Name: !Sub '${Project}-${Environment}-vpc-b'
        ConnectionType: NETWORK
        PhysicalConnectionRequirements:
          SubnetId:
            Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetB'
          AvailabilityZone:
            Fn::ImportValue: !Sub '${Project}-${Environment}-AppSubnetBAz'
          SecurityGroupIdList:
            - Fn::ImportValue: !Sub '${Project}-${Environment}-GlueSG'

  TransformJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub '${Project}-${Environment}-transform'
      Role: !GetAtt GlueRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: '3.9'
        ScriptLocation: !Sub
          - 's3://${Bucket}/pipeline/${CodeVersion}/transform.py'
          - Bucket:
              Fn::ImportValue: !Sub '${Project}-${Environment}-ArtifactsBucket'
      MaxCapacity: 1
      MaxRetries: 0
      Timeout: 60
      ExecutionProperty: {MaxConcurrentRuns: 1}
      Connections:
        Connections: [!Ref GlueConnectionA, !Ref GlueConnectionB]
      DefaultArguments:
        library-set: analytics
        --TempDir: !Sub 's3://${GlueTempBucket}/temp/'
        --raw_bucket: !Ref RawBucket
        --curated_bucket: !Ref CuratedBucket
        --db_secret_arn:
          Fn::ImportValue: !Sub '${Project}-${Environment}-AppDbSecretArn'
        # Bundle de CAs de RDS. Va por S3 porque el job corre en subredes
        # privadas sin NAT: no puede bajarlo de internet.
        --rds_ca_s3_uri: !Sub
          - 's3://${Bucket}/pipeline/${CodeVersion}/rds-ca-bundle.pem'
          - Bucket:
              Fn::ImportValue: !Sub '${Project}-${Environment}-ArtifactsBucket'
        --extra-py-files: !Sub
          - 's3://${Bucket}/pipeline/${CodeVersion}/deps.zip'
          - Bucket:
              Fn::ImportValue: !Sub '${Project}-${Environment}-ArtifactsBucket'

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub '${Project}_${Environment}'
        Description: Data lake de avisos de alquiler

  # Tabla de avisos de curated. Las columnas son el contrato de bronze tipado
  # -- las mismas que escribe glue/transform.py (COLUMNAS) y que produce cada
  # extractor (write_csv() en etl/extract/scrape_infocasas.py). Si se agrega
  # una columna al contrato, va en los tres lugares.
  # `datos_crudos` queda afuera a propósito: el JSON entero del aviso se
  # guarda en raw, no en la tabla analítica.
  # Partition projection evita registrar particiones a mano o con un crawler.
  AvisosTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: avisos
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: 'true'
          projection.fecha.type: date
          projection.fecha.format: yyyy-MM-dd
          projection.fecha.range: 2026-01-01,NOW
          projection.fecha.interval: '1'
          projection.fecha.interval.unit: DAYS
          storage.location.template: !Sub 's3://${CuratedBucket}/avisos/fecha=${!fecha}/'
        PartitionKeys:
          - {Name: fecha, Type: string}
        StorageDescriptor:
          Location: !Sub 's3://${CuratedBucket}/avisos/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - {Name: listing_id, Type: string}
            - {Name: fuente_datos, Type: string}
            - {Name: barrio, Type: string}
            - {Name: direccion, Type: string}
            - {Name: operacion, Type: string}
            - {Name: tipo_propiedad, Type: string}
            - {Name: estado, Type: string}
            - {Name: descripcion, Type: string}
            - {Name: amenities, Type: string}
            - {Name: fotos, Type: string}
            # Fechas como string ISO: el tipado fino es trabajo de silver (dbt).
            - {Name: publicado_en, Type: string}
            - {Name: ingestado_en, Type: string}
            - {Name: dormitorios, Type: bigint}
            - {Name: banos, Type: bigint}
            - {Name: metraje_m2, Type: bigint}
            - {Name: foto_count, Type: bigint}
            - {Name: latitud, Type: double}
            - {Name: longitud, Type: double}
            - {Name: precio, Type: double}
            - {Name: hash_contenido, Type: string}

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub '${Project}-${Environment}'
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 1073741824
        ResultConfiguration:
          OutputLocation: !Sub 's3://${AthenaResultsBucket}/'

  # ---------------------------------------------------------------- Orquestación
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: states.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orquestar
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt InfoCasasFunction.Arn
              - Effect: Allow
                Action: [glue:StartJobRun, glue:GetJobRun, glue:GetJobRuns, glue:BatchStopJobRun]
                Resource: !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${TransformJob}'
              # Las fallas no se avisan desde la state machine: las toma
              # ExecutionFailedRule (abajo) y las publica en el topic de
              # alertas, con el ARN de la ejecución para ir al detalle.

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${Project}-${Environment}-corrida-semanal'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      DefinitionSubstitutions:
        InfoCasasArn: !GetAtt InfoCasasFunction.Arn
        GlueJobName: !Ref TransformJob
      Definition:
        Comment: Corrida semanal, extracción de InfoCasas en tandas y transformación con Glue
        TimeoutSeconds: 7200
        StartAt: PrepararFecha
        States:
          # La fecha de la corrida sale de la hora programada por el Scheduler.
          # Todas las escrituras usan esa fecha en sus claves: relanzar la misma
          # semana pisa los mismos archivos en lugar de duplicarlos.
          PrepararFecha:
            Type: Pass
            Parameters:
              fecha.$: States.ArrayGetItem(States.StringSplit($.scheduled_time, 'T'), 0)
            Next: Scraping
          # Una rama por fuente. Hoy solo InfoCasas: sumar una fuente es
          # agregar su rama acá (ver infra/README.md, "Sumar una fuente").
          # Si una rama falla, falla la corrida entera y no se transforma
          # nada a medias.
          Scraping:
            Type: Parallel
            ResultPath: $.scraping
            Next: Transformar
            Branches:
              - StartAt: PlanificarInfoCasas
                States:
                  # Cuántas páginas tiene el sitio hoy y en cuántas tandas se
                  # parte la corrida. Se calcula en cada corrida porque el
                  # total de avisos cambia semana a semana.
                  PlanificarInfoCasas:
                    Type: Task
                    Resource: arn:aws:states:::lambda:invoke
                    Parameters:
                      FunctionName: ${InfoCasasArn}
                      Payload:
                        modo: plan
                        fecha.$: $.fecha
                    ResultSelector:
                      tandas.$: $.Payload.tandas
                      total_paginas.$: $.Payload.total_paginas
                    ResultPath: $.plan
                    TimeoutSeconds: 120
                    Retry:
                      - ErrorEquals: [States.ALL]
                        IntervalSeconds: 30
                        BackoffRate: 2
                        MaxAttempts: 2
                    Next: TandasInfoCasas
                  # MaxConcurrency 1: las tandas van una después de la otra,
                  # no en paralelo. El extractor ya espera entre requests
                  # (DEFAULT_DELAY_SECONDS) y correrlas juntas multiplicaría
                  # el ritmo contra el sitio.
                  TandasInfoCasas:
                    Type: Map
                    ItemsPath: $.plan.tandas
                    MaxConcurrency: 1
                    ResultPath: $.tandas
                    ItemProcessor:
                      ProcessorConfig: {Mode: INLINE}
                      StartAt: ExtraerTanda
                      States:
                        ExtraerTanda:
                          Type: Task
                          Resource: arn:aws:states:::lambda:invoke
                          Parameters:
                            # El plan ya dejó cada tanda con todo lo que la
                            # invocación necesita (modo, fecha, order,
                            # start_page, pages).
                            FunctionName: ${InfoCasasArn}
                            Payload.$: $
                          OutputPath: $.Payload
                          TimeoutSeconds: 960
                          Retry:
                            - ErrorEquals: [States.ALL]
                              IntervalSeconds: 60
                              BackoffRate: 2
                              MaxAttempts: 2
                          End: true
                    End: true
          Transformar:
            Type: Task
            Resource: arn:aws:states:::glue:startJobRun.sync
            Parameters:
              JobName: ${GlueJobName}
              Arguments:
                --fecha.$: $.fecha
            ResultPath: $.glue
            Retry:
              - ErrorEquals: [States.TaskFailed]
                IntervalSeconds: 300
                MaxAttempts: 1
            End: true

  # ---------------------------------------------------------------- Scheduler
  SchedulerDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Project}-${Environment}-scheduler-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
      Policies:
        - PolicyName: iniciar-corrida
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref StateMachine
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDlq.Arn

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Project}-${Environment}-semanal'
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: America/Montevideo
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !Ref StateMachine
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"scheduled_time": "<aws.scheduler.scheduled-time>"}'
        RetryPolicy:
          MaximumRetryAttempts: 5
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDlq.Arn

  # ---------------------------------------------------------------- Alertas
  SchedulerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: El Scheduler no pudo iniciar la corrida semanal
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt SchedulerDlq.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub '${Project}-${Environment}-AlertsTopicArn'

  ExecutionFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Corrida semanal terminada con error
      EventPattern:
        source: [aws.states]
        detail-type: [Step Functions Execution Status Change]
        detail:
          status: [FAILED, TIMED_OUT, ABORTED]
          stateMachineArn: [!Ref StateMachine]
      Targets:
        - Id: alertas
          Arn:
            Fn::ImportValue: !Sub '${Project}-${Environment}-AlertsTopicArn'

  GlueFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Job de Glue terminado con error
      EventPattern:
        source: [aws.glue]
        detail-type: [Glue Job State Change]
        detail:
          jobName: [!Ref TransformJob]
          state: [FAILED, TIMEOUT, ERROR]
      Targets:
        - Id: alertas
          Arn:
            Fn::ImportValue: !Sub '${Project}-${Environment}-AlertsTopicArn'

Outputs:
  StateMachineArn:
    Value: !Ref StateMachine
  RawBucketName:
    Value: !Ref RawBucket
  CuratedBucketName:
    Value: !Ref CuratedBucket
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
